name: Check Vercel preparation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: python scripts/check_deployment.py
      - run: node --check viewer/app.js
